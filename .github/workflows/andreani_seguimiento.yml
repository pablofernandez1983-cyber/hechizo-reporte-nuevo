name: Seguimiento Andreani

# Lee la página pública de seguimiento de los envíos de Andreani en viaje (andreani_seguimiento.py)
# a las 6 h de Argentina; la revisión de las 7 (ventas-service → /envios/revisar) usa el resultado.
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  andreani:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright boto3
          playwright install chromium
          playwright install-deps chromium

      - name: Leer seguimiento de Andreani
        env:
          AWS_S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        run: |
          python andreani_seguimiento.py
