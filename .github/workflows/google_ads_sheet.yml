name: Google Ads -> Sheet de pagos

# OJO: el cron mensual esta DESACTIVADO a proposito (19/9/2026).
# Este workflow carga un ESTIMADO (cost_micros x1,21), no el pago real, y el
# P&L (reporte_nuevo.fetch_google_ads) suma las filas de tipo "Pagos". Si el
# estimado se cargara solo y despues se pega el export real de Transacciones,
# el mes quedaria contado dos veces. Queda solo en modo manual hasta definir
# de donde sale el importe exacto pagado.
on:
  # schedule:
  #   - cron: '0 12 3 * *'
  workflow_dispatch:
    inputs:
      mes:
        description: 'Mes a cargar (YYYY-MM). Vacio = mes anterior'
        required: false
        default: ''

jobs:
  cargar-gasto-google-ads:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install google-ads google-api-python-client google-auth PyYAML

      - name: Cargar gasto de Google Ads en el Sheet
        env:
          GOOGLE_ADS_YAML: ${{ secrets.GOOGLE_ADS_YAML }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID_GOOGLE_ADS: ${{ secrets.SHEET_ID_GOOGLE_ADS }}
        run: |
          python google_ads_sheet.py ${{ github.event.inputs.mes }}
